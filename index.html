<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Contact Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 450px;
      margin: 40px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    .field {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      margin-bottom: 5px;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-email {
      background-color: #0070f3;
      color: white;
      border: none;
    }
    .btn-whatsapp {
      background-color: #25D366;
      color: white;
      border: none;
    }
    hr {
      margin: 20px 0;
    }
  </style>
</head>
<body>

  <h2>Contact Test Form</h2>

  <!-- 1. EMAIL FORM -->
  <form id="emailForm">
    <!-- Replace this with your Web3Forms Access Key after step 1 below -->
    <input type="hidden" name="access_key" value="18ed4c2a-81e4-41cc-bb27-5538edf2f9ea">

    <div class="field">
      <label for="email_name">Name:</label>
      <input type="text" id="email_name" name="name" required placeholder="Mario Rossi">
    </div>

    <div class="field">
      <label for="email_phone">Phone Number:</label>
      <input type="tel" id="email_phone" name="phone" required placeholder="+39 333 1234567">
    </div>

    <div class="field">
      <label for="email_message">Message:</label>
      <textarea id="email_message" name="message" rows="4" required placeholder="I want to book..."></textarea>
    </div>

    <button type="submit" class="btn-email">Send via Email</button>
  </form>

  <hr>

  <!-- 2. WHATSAPP DIRECT BUTTON -->
  <div class="field">
    <label for="wa_message">Or Send Direct WhatsApp Message:</label>
    <textarea id="wa_message" rows="3" placeholder="Type message to send on WhatsApp..."></textarea>
    <button type="button" class="btn-whatsapp" onclick="sendWhatsApp()">Send on WhatsApp</button>
  </div>

  <p id="status"></p>

  <script>
    // --- 1. HANDLE EMAIL FORM SUBMISSION ---
    const emailForm = document.getElementById('emailForm');
    const statusText = document.getElementById('status');

    emailForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusText.innerText = 'Sending email...';

      const formData = new FormData(emailForm);

      try {
        const response = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (data.success) {
          statusText.innerText = '✅ Email sent successfully! Check your inbox.';
          emailForm.reset();
        } else {
          statusText.innerText = '❌ Error: ' + data.message;
        }
      } catch (err) {
        statusText.innerText = '❌ Something went wrong while sending.';
      }
    });

    // --- 2. HANDLE WHATSAPP MESSAGE ---
    function sendWhatsApp() {
      // REPLACE WITH YOUR PHONE NUMBER IN INTERNATIONAL FORMAT (No + or spaces)
      // Example for Italy: 393331234567
      const targetPhone = 'YOUR_PHONE_NUMBER_HERE'; 

      const msg = document.getElementById('wa_message').value;

      if (!msg.trim()) {
        alert('Please enter a message for WhatsApp.');
        return;
      }

      // Encode message text for URL string formatting
      const encodedMsg = encodeURIComponent(msg);
      
      // Open WhatsApp direct chat deep link
      window.open(`https://wa.me/${targetPhone}?text=${encodedMsg}`, '_blank');
    }
  </script>

</body>
</html>
