<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed!</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f4f5f7;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 90vh;
    }
    .card {
      background: white;
      max-width: 420px;
      width: 100%;
      padding: 32px 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .icon-box {
      width: 70px;
      height: 70px;
      background-color: #e6f4ea;
      color: #137333;
      font-size: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 24px;
      color: #111;
    }
    p {
      color: #666;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .info-box {
      background-color: #f8fafc;
      border: 1px dashed #cbd5e1;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 24px;
      text-align: left;
    }
    .info-box p {
      margin: 4px 0;
      font-size: 13px;
      color: #475569;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background-color: #0070f3;
      color: white;
      text-decoration: none;
      padding: 12px 0;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #0059b3;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon-box">✓</div>
    <h1>Order Received!</h1>
    <p>Thank you for your order. We’ve received your details and are preparing it now.</p>

    <div class="info-box">
      <p><strong>What happens next?</strong></p>
      <p>• We'll send a confirmation SMS or call if needed.</p>
      <p>• Estimated delivery / prep time: <strong>25–35 mins</strong>.</p>
    </div>

    <!-- Link back to Page 1 -->
    <a href="index.html" class="btn">Back to Menu</a>
  </div>

</body>
</html>
